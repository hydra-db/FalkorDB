name: Publish Hydra FalkorDB image to ECR

on:
  push:
    branches: [master, v4.18.6-hydra1, v4.18.6-hydra2, v4.18.6-hydra3, v4.18.6-hydra4, v4.18.6-hydra5, v4.18.6-hydra6]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: falkordb/falkordb
  IMAGE_TAG: v4.18.6-hydra6

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # AWS_ROLE_ARN org secret isn't scoped to this fork repo (expands empty ->
          # "Could not load credentials"); fall back to the literal cicd role ARN.
          # Not sensitive: account is already in the ECR URL; role trusts repo:usecortex/* only.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::525753068359:role/github-actions-cicd-role' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build compiler image
        run: |
          docker build \
            --platform linux/amd64 \
            -f build/docker/Dockerfile.compiler \
            -t falkordb-compiler:${{ env.IMAGE_TAG }} \
            .

      - name: Build and push runtime image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker build \
            --platform linux/amd64 \
            -f build/docker/Dockerfile \
            --build-arg BASE_IMAGE=falkordb-compiler:${{ env.IMAGE_TAG }} \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
